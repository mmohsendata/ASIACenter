services:
  - type: web
    name: asia-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    healthCheckPath: /api/auth/session
    envVars:
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1v0xtVj9v42RFNgNEBfO6Yt2q31t2azVH
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
